name: Probe 34

# Read only. Downloads the City's Annual Financial Reports 2021-2025 and the 2024 year-end update, and saves their text
# so what they say about the operating surplus and where it goes can be checked with page numbers. Output goes to fetched-34.

on: {push: {branches: [site-check-34]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {path: probe}
      - name: Reports
        run: |
          set +e
          sudo apt-get install -y -qq poppler-utils > /dev/null 2>&1
          mkdir -p out
          B=https://www.calgary.ca/content/dam/www/cfod/finance/documents
          get() { for u in "${@:2}"; do curl -fsSL -A "Mozilla/5.0" "$u" -o out/$1.pdf && file out/$1.pdf | grep -q PDF && echo "$1 $u" >> out/got.txt && return; done; echo "$1 MISSING" >> out/got.txt; rm -f out/$1.pdf; }
          get afr2025 $B/2025-Annual-Financial-Report.pdf
          get afr2024 $B/Finance-2024-Annual-Report.pdf
          get afr2023 $B/Finance-2023-Annual-Report.pdf
          get afr2022 $B/Finance-2022-Annual-Report.pdf $B/2022-Annual-Financial-Report.pdf $B/Finance-2022-Annual-Financial-Report.pdf $B/annual-reports/2022-annual-report.pdf
          get afr2021 $B/Finance-2021-Annual-Report.pdf $B/2021-Annual-Financial-Report.pdf $B/Finance-2021-Annual-Financial-Report.pdf $B/annual-reports/2021-annual-report.pdf
          get ye2024 $B/financial-economic-update-2024-year-end-Q1-2025.pdf
          for f in out/*.pdf; do pdftotext -layout $f ${f%.pdf}.txt; done
          for y in 2021 2022; do [ -f out/afr$y.txt ] && python3 probe/audit/read1.py out/afr$y.txt $y > out/read1-$y.json 2> out/read1-$y.err; done
          python3 - <<'PY' > out/surplus.txt
          import glob, re
          for t in sorted(glob.glob('out/*.txt')):
              if 'got' in t or 'surplus' in t: continue
              pages = open(t, encoding='utf-8', errors='replace').read().split('\f')
              for i, p in enumerate(pages):
                  lines = p.splitlines()
                  for j, l in enumerate(lines):
                      if re.search(r'surplus', l, re.I) and re.search(r'reserve|fiscal stability|operating', ' '.join(lines[max(0,j-2):j+3]), re.I):
                          print(f'== {t} pdf page {i+1} line {j+1}')
                          print('\n'.join(x.strip() for x in lines[max(0,j-3):j+4]))
          PY
          rm -f out/*.pdf; ls -la out; cat out/got.txt; wc -l out/surplus.txt
      - name: Push to fetched-34 (evidence only)
        if: always()
        run: |
          set +e
          cd probe
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -q --orphan fetched-34
          git rm -rqf --cached . > /dev/null 2>&1
          rm -rf audit .github; mv ../out out
          git add -f out && git commit -qm "City annual financial reports: text for the surplus check (evidence only)" && git push -qf origin fetched-34
