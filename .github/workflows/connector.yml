name: Connector

# The Calgary Insight connector (connector/): an MCP server that lets Claude, ChatGPT and other AI apps read the
# website's data. Every run checks it against the published website (a copy of what Data Genie reads, put through
# web/mcp_answers.py) and City open data. It deploys to Cloudflare Workers from main (approved Nov 18, 2026), with the
# CLOUDFLARE_API_TOKEN secret the AI gateway uses. To switch deploys off, set the repository variable PUBLISH_CONNECTOR to "false".
on:
  push:
    branches: [main, connector]
    paths: ['connector/**', 'web/mcp_answers.py', '.github/workflows/connector.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install numpy scipy openpyxl pypdf
      - name: Copy what Data Genie reads from the published website
        run: python connector/mirror.py https://calgaryinsight.ca/ _mirror
      - name: The connector's answers (Data Genie's own tools)
        run: python web/mcp_answers.py _mirror
      - name: Test the connector
        run: MIRROR=_mirror LIVE=1 node connector/test.mjs

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_CONNECTOR != 'false'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: connector
        run: |
          set -e
          T="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE 'Bearer[[:space:]]+[A-Za-z0-9_-]+' | tail -1 | awk '{print $2}')"
          [ -n "$T" ] && CLOUDFLARE_API_TOKEN="$T"
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@3.99.0 deploy | tee deploy.txt
          U=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          echo "Connector address: $U/mcp"
          echo "### Connector address: $U/mcp" >> "$GITHUB_STEP_SUMMARY"
          curl -s -X POST "$U/mcp" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('Live check:',j.result.tools.length,'tools')})"
