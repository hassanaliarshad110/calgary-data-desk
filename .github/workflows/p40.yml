name: Probe 40

# Read only. Asks the live Data Genie and Data Scientist the trap questions (audit/trap_questions.json) on the live
# site's own Genie files, with the site key. Output goes to fetched-40.

on: {push: {branches: [site-check-40]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: probe}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ask
        env: {KEY: '${{ secrets.ANTHROPIC_API_KEY }}'}
        run: |
          set +e
          mkdir -p out app/_appdata
          curl -fsSL "https://calgaryinsight.ca/py/manifest.json?nc=$RANDOM" -o app/_manifest.json
          python3 probe/audit/fetch_app.py
          grep -c "Answer the question asked, not a nearby one" app/agent.py > out/live_rule.txt
          grep -n "GENIE.web" app/web/webapp.py >> out/live_rule.txt
          ls app/data | grep -E "new_communities|active_transportation" >> out/live_rule.txt
          pip install -q requests openpyxl > /dev/null 2>&1
          KEY="$KEY" python3 probe/audit/trap_ask.py "$PWD/app" "$PWD/out/trap.txt" > out/run.txt 2>&1
          tail -30 out/run.txt
      - name: Push to fetched-40 (evidence only)
        if: always()
        run: |
          set +e
          cd probe
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -q --orphan fetched-40
          git rm -rqf --cached . > /dev/null 2>&1
          rm -rf audit .github; mv ../out out
          git add -f out && git commit -qm "Trap question test (evidence only)" && git push -qf origin fetched-40
