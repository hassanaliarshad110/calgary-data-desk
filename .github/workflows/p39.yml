name: Probe 39

# Read only. Runs the Data Genie's tools offline against the live site's Genie files with the genie-bva code on top,
# and asks it two questions once (Fast), with the site key. Output goes to fetched-39.

on: {push: {branches: [site-check-39]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {path: probe}
      - uses: actions/checkout@v4
        with: {ref: clarify, path: code}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ask
        env: {KEY: '${{ secrets.ANTHROPIC_API_KEY }}'}
        run: |
          set +e
          mkdir -p out app/_appdata
          S=https://calgaryinsight.ca
          curl -fsSL "$S/py/manifest.json?nc=$RANDOM" -o app/_manifest.json
          python3 probe/audit/fetch_app.py
          cp code/*.py app/ && cp code/web/webapp.py app/web/webapp.py
          cp code/ui/budget-intel/budget-vs-actual.json app/data/budget-vs-actual.json
          python3 probe/audit/new_registry.py
          pip install -q requests openpyxl > /dev/null 2>&1
          KEY="$KEY" python3 probe/audit/check_ask.py "$PWD/app" "$PWD/out/check.txt" > out/run.txt 2>&1
          tail -40 out/run.txt
      - name: Push to fetched-39 (evidence only)
        if: always()
        run: |
          set +e
          cd probe
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -q --orphan fetched-39
          git rm -rqf --cached . > /dev/null 2>&1
          rm -rf audit .github; mv ../out out
          git add -f out && git commit -qm "Request check test (evidence only)" && git push -qf origin fetched-39
