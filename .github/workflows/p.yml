name: Live data 20
on: {push: {branches: [site-check-20]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          i=0
          for u in https://calgaryinsight.ca/py/manifest.json https://calgaryinsight.ca/py/data/pay_study.json https://calgaryinsight.ca/py/pay_study.py https://calgaryinsight.ca/py/agent.py; do
            i=$((i+1)); curl -sSL -A "$UA" --compressed -o "out/p$i.html" "$u" -w "p$i $u %{http_code} %{size_download}\n" >> out/log.txt || true
          done
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -b fetched-20e
          git add -f out && git commit -qm "Pages" && git push -f origin fetched-20e
