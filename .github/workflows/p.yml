name: Probe 8
on: {push: {branches: [site-check-8]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pypdf
      - run: |
          mkdir -p c
          python schooltax.py st.json c > out.txt || true
          grep -i "skipped" out.txt || true
          python show.py
