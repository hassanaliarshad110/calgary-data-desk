name: Probe 8
on: {push: {branches: [site-check-8]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          mkdir -p c out
          python tourism.py out/tourism.json c > out/log.txt || true
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -b fetched-9
          git add out/tourism.json out/log.txt && git commit -qm "Tourism data" && git push -f origin fetched-9
