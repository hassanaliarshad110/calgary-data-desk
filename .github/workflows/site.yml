name: Website

on:
  schedule:
    - cron: '23 11 * * *'     # every morning, about 4:20 a.m. in Calgary
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'ui/**', 'web/**', 'data/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

env:
  PYODIDE_VERSION: '0.26.4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools for locking the Claude key, and for the distance from every home (Growth vs amenities)
        run: pip install cryptography numpy scipy openpyxl overturemaps

      # the weekly and daily copies (assessment roll, Census, police file) carry over between runs
      - uses: actions/cache/restore@v4
        with:
          path: .site-cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      - name: Python for Data Genie in the browser (Pyodide)
        run: |
          curl -fsSL --retry 3 --retry-delay 15 --retry-all-errors -o pyodide.tar.bz2 "https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-core-${PYODIDE_VERSION}.tar.bz2" || {
            echo "GitHub release download failed, using the jsDelivr copy"
            mkdir -p pyodide
            for f in pyodide.js pyodide.mjs pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json package.json; do
              curl -fsSL --retry 4 --retry-delay 10 --retry-all-errors -o "pyodide/$f" "https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/$f"
            done
            tar -cjf pyodide.tar.bz2 pyodide && rm -rf pyodide
          }
          tar -xjf pyodide.tar.bz2

      - name: Build every ward from public data
        env:
          TZ: America/Edmonton
          CDD_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CDD_ACCESS_CODE: ${{ secrets.GENIE_ACCESS_CODE }}
          CDD_EA_CODE: ${{ secrets.ELECTION_ACCESS_CODE }}
          CDD_BIZ_CODE: ${{ secrets.BUSINESS_ACCESS_CODE }}
          CDD_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CDD_SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          CDD_SITE_URL: https://calgaryinsight.ca/
          CDD_SOCRATA_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          CDD_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}     # optional Google sign-in for Data Genie's memory (public web settings)
          CDD_AI_GATEWAY: ${{ vars.AI_GATEWAY_URL }}            # the AI gateway's address (gateway/), or gateway/url.txt
          CDD_GOOGLE_VERIFY: ${{ vars.GOOGLE_SITE_VERIFICATION }}  # Google Search Console's verification tag (or its code)
        run: python web/build_site.py _site --cache .site-cache --pyodide pyodide

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .site-cache
          key: site-cache-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000     # GitHub's file sync can take more than the default 10 minutes

      # tell IndexNow (Bing, DuckDuckGo, Yandex and others) the pages are new; Google reads the sitemap itself
      - name: Tell search engines about the new pages
        continue-on-error: true
        run: |
          sleep 60
          curl -fsS https://calgaryinsight.ca/indexnow-urls.txt -o urls.txt
          KEY=$(curl -fsS https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/web/indexnow.txt)
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1].strip()
          urls = [u.strip() for u in open('urls.txt') if u.strip()][:10000]
          body = json.dumps({'host': 'calgaryinsight.ca', 'key': key, 'keyLocation': f'https://calgaryinsight.ca/{key}.txt', 'urlList': urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print('IndexNow', r.status, len(urls), 'pages')
          except Exception as e:
              print('IndexNow not reached:', e)
          PY
