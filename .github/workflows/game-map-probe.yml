name: Game map probe
on:
  push:
    branches: [game-map-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy rasterio pyproj mapbox-earcut && sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null && ogrinfo --version
      - env:
          SOCRATA_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python probe/game_assets.py _out
      - run: |
          cd _out && ls -la
          git init -q -b game-map-probe-out
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add -A && git commit -q -m "Game map data"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" game-map-probe-out
