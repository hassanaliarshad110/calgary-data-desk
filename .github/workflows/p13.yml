name: Probe 13
on: {push: {branches: [site-check-13]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          pip install -q pillow requests
          python3 probe.py > out/log.txt 2>&1 || true
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -b fetched-13
          git add -f out && git commit -qm "Day trip photos and routes" && git push -f origin fetched-13
