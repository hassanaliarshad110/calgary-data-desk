name: Budget probe
on:
  push:
    branches: [budget-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python probe/tts_ep9.py _b
      - run: mkdir -p _b/src && curl -sSL -m 40 -A 'Mozilla/5.0' -o _b/src/whinfield_msn01.htm https://sacred-texts.com/isl/masnavi/msn01.htm
        continue-on-error: true
      - run: |
          mkdir -p _b && date -u > _b/ran_at.txt
          cd _b
          git init -q -b budget-probe-out
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add -A && git commit -q -m "Susuman ep9 voices"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" budget-probe-out
