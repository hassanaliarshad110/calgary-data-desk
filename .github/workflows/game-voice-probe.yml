name: Game voice probe
on:
  push:
    branches: [game-voice-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q numpy soundfile
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: bash probe/$(cat probe/job.txt 2>/dev/null || echo fetch3d.sh) _out
      - run: |
          cd _out && du -sh . && ls
          git init -q -b $(cat ../probe/outbranch.txt 2>/dev/null || echo game-voice-probe-out)
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add -A && git commit -q -m "Game voices"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $(cat ../probe/outbranch.txt 2>/dev/null || echo game-voice-probe-out)
