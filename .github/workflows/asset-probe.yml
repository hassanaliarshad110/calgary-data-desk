name: Asset probe
on:
  push:
    branches: [asset-probe]
permissions:
  contents: write
concurrency:
  group: asset-probe
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python probe/acquire.py _b
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', STEPS: 'kenney,fbx2gltf,rigged3d,fonts2,roads' }
      - run: |
          mkdir -p _b && date -u > _b/ran_at.txt
          cd _b
          git init -q -b asset-probe-out2
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add -A && git commit -q -m "Acquired assets"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" asset-probe-out2
