name: Asset probe
on:
  push:
    branches: [asset-probe]
permissions:
  contents: write
concurrency:
  group: asset-probe
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          mkdir -p _b/song && cd _b/song
          curl -fsSL -A "Mozilla/5.0" -o index.html https://calgaryinsight.ca/game/ || echo fail-index
          grep -o -i '[a-z0-9_./-]*under[-_]one[-_]sky[a-z0-9_.-]*' index.html | sort -u > refs.txt || true
          for p in game/audio/under-one-sky.mp3 game/city-stories/audio/under-one-sky.mp3 game/audio/under_one_sky.mp3 city-stories/audio/under-one-sky.mp3; do
            if curl -fsSL -A "Mozilla/5.0" -o under-one-sky.mp3 "https://calgaryinsight.ca/$p"; then echo "ok $p" > found.txt; break; fi
          done
          ls -la; cat refs.txt found.txt 2>/dev/null || true
      - run: |
          mkdir -p _b && date -u > _b/ran_at.txt
          cd _b
          git init -q -b asset-probe-out5
          git config user.name "Hassan Ali"
          git config user.email "hassanaliarshad110@users.noreply.github.com"
          git add -A && git commit -q -m "Acquired assets"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" asset-probe-out5
