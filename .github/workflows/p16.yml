name: Probe 16
on: {push: {branches: [site-check-16]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          pip install -q requests pdfplumber
          python3 probe.py > out/log.txt 2>&1 || true
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -b fetched-16
          git add -f out && git commit -qm "City rates fetch" && git push -f origin fetched-16
