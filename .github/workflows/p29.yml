name: Probe 29

# Read only. Builds the accuracy-fixes branch with the site's own build command (no secrets, nothing published, no cache
# saved), then checks the result: the audit's consistency checks, the Dashboard against the City's data, and every
# screen in a browser. Output goes to the branch fetched-29.

on: {push: {branches: [site-check-29]}}
permissions: {contents: write}
env:
  PYODIDE_VERSION: '0.26.4'
  REF: 9c86c9bc58c221a652628e4cd32cc74a20894381
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with: {path: probe}
      - uses: actions/checkout@v4
        with: {ref: 9c86c9bc58c221a652628e4cd32cc74a20894381, path: site}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Tools, as in the Website workflow
        run: pip install cryptography numpy scipy openpyxl overturemaps pypdf shapely
      - uses: actions/cache/restore@v4
        with:
          path: site/.site-cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-
      - name: Pyodide
        working-directory: site
        run: |
          curl -fsSL --retry 3 -o pyodide.tar.bz2 "https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-core-${PYODIDE_VERSION}.tar.bz2"
          tar -xjf pyodide.tar.bz2
      - name: Full build of the branch (no secrets, nothing published)
        working-directory: site
        env:
          TZ: America/Edmonton
          CDD_SITE_URL: https://calgaryinsight.ca/
        run: |
          set +e
          mkdir -p ../out
          python web/build_site.py _site --cache .site-cache --pyodide pyodide > ../out/build-log.txt 2>&1
          echo "build exit $?" > ../out/summary.txt
          grep -E '^(ok  |FAIL) ' ../out/build-log.txt > ../out/steps.txt
          python -c "import json; b=json.load(open('_site/data/built.json')); bad=[(s['step'],s.get('error','')[:150]) for s in b['steps'] if not s.get('ok')]; print('steps', len(b['steps']), 'failed', len(bad), bad, 'minutes', b['minutes'])" >> ../out/summary.txt
      - name: Checks on the built data
        if: always()
        run: |
          set +e
          D=site/_site/data
          python probe/audit/consistency.py $D out/consistency1.json > out/consistency1.txt 2>&1
          python probe/audit/consistency2.py $D out/consistency2.json > out/consistency2.txt 2>&1
          python probe/audit/independent_city.py out > out/independent.txt 2>&1
          mkdir -p out/live/city_actual && cp $D/city_actual/w0.json out/live/city_actual/w0.json
          python probe/audit/compare_city.py out out/compare.json > out/compare.txt 2>&1
          python - <<'PY' > out/fixed-figures.txt 2>&1
          import json
          D = 'site/_site/data'
          w = json.load(open(D + '/city_actual/w0.json')); S = w['summary']
          print('311 requests12', S['requests12'], 'no community', S.get('requests12_no_community'), 'prev', S['requests_prev'], 'change', S['requests_change_pct'])
          print('open', S['open_now'], 'no community', S.get('open_no_community'), 'over 90', S['open_over_90_days'], 'per 1000', S['open_per_1000'])
          print('infra', S['infra12'], S['infra_prev'], '| closed 7d', S['closed_7_days_pct'], S['closed_7_days_pct_city'], '| app', S['app_share_pct'], S['app_share_pct_city'])
          print('per 1000', S['requests_per_1000'], S['infra_per_1000'])
          print('trend sum', sum(w['trend']['all']), 'dept sum', sum(x['n'] for x in w['dept_times']['city']))
          dv = w['development']; print('dp applied', dv['applied'], 'prev', dv['applied_prev'], 'wards table', w['wards_summary']['city']['dev_permits12'])
          sc = w['families']['schools']; print('students', sc['students'], 'elsewhere', json.dumps(sc.get('taught_elsewhere'))[:400], '| note', sc['note'][:200])
          print('ward students', {x['ward']: x['students'] for x in w['wards_summary']['wards']})
          cc = w['families']['child_care']; print('child care spaces', cc['spaces'], 'programs', cc['programs_counted'], 'unplaced', cc.get('unplaced'), 'unlocated', cc.get('unlocated'))
          print('child care note', cc['note'][-300:])
          print('names with apostrophe-S', sum(1 for p in cc['programs'] if "'S" in p['name']))
          print('wards table child care', w['wards_summary']['city']['child_care_spaces'])
          I = json.load(open(D + '/infra.json'))['city']; print('infra breaks', I['breaks_n12'], I['breaks_nprev'], 'through', I.get('breaks_through'), 'mains km', I['mains_km'])
          pc = [c for c in w['population']['checks']['checks'] if c['key'] == 'schools']; print('school growth check', json.dumps(pc)[:400])
          try:
              st = json.load(open(D + '/school_tax.json')); print('school tax students', json.dumps(st['students'].get('calgary_city_schools'))[:200], 'per student', st['tax_per_student'].get('calgary_all_city_schools'))
          except Exception as e: print('school tax', e)
          PY
          cat out/summary.txt out/fixed-figures.txt
      - name: Every screen in a browser
        if: always()
        run: |
          set +e
          cd probe && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1; cd ..
          (cd site/_site && python -m http.server 8811 > /dev/null 2>&1 &) ; sleep 3
          export NODE_PATH=$PWD/probe/node_modules
          node site/docs/calgary-budget-intelligence/FINAL-VERIFICATION/evidence/tools/smoke.js http://127.0.0.1:8811 out/smoke budget-intelligence > out/smoke.txt 2>&1
          python -c "import json; r=json.load(open('out/smoke/results.json')); bad=[(x['device'],x['view'],x['jsErrors'][:1],x['localFailures'][:2]) for x in r if not x['shown'] or x['jsErrors'] or x['localFailures']]; print('screens', sum(1 for x in r if x['shown']), 'of', len(r), 'problems', bad)" >> out/summary.txt
          SITE=http://127.0.0.1:8811 node probe/audit/budget_pr.js >> out/summary.txt 2>&1
          node probe/audit/screen_text.js http://127.0.0.1:8811 out/screens dashboard,issues,families,compare,infra,budget,growth > out/screens.txt 2>&1
          rm -rf out/smoke/*.jpg
          cat out/summary.txt
      - name: Push to fetched-29 (evidence only)
        if: always()
        run: |
          set +e
          cd probe
          git config user.name "Hassan Ali"; git config user.email hassanaliarshad110@users.noreply.github.com
          git checkout -q --orphan fetched-29
          git rm -rqf --cached . > /dev/null 2>&1
          rm -rf audit .github node_modules package*.json; mv ../out out
          git add -f out && git commit -qm "Accuracy fixes: read-only build and checks (evidence only)" && git push -qf origin fetched-29
