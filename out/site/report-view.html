<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Opening your report · Calgary Insight</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui,sans-serif;background:#F8FAFC;color:#334155}
@media (prefers-color-scheme:dark){body{background:#020617;color:#CBD5E1}}</style></head>
<body><p id="m">Opening your report…</p>
<script>
// A report made in the visitor's browser (Data Genie, the Data Scientist and the analysts), shown on a real page of the
// website rather than a blob: address: phones and some browsers save a blob: page as an empty (0 KB) PDF.
(function () {
  var got = false;
  addEventListener('message', function (e) {
    if (got || e.origin !== location.origin || !e.data || e.data.type !== 'cdd-report') return;
    got = true;
    try { e.source && e.source.postMessage({ type: 'cdd-report-got' }, location.origin); } catch (x) { /* the site tab closed */ }
    var title = String(e.data.title || 'Calgary Insight report');
    document.open(); document.write(e.data.html); document.close();
    // the saved PDF takes the page title as its file name: keep it short and free of characters Windows refuses
    try { document.title = title; } catch (x) { /* keep the report's own */ }
  });
  function ready() { try { opener && opener.postMessage({ type: 'cdd-report-ready' }, location.origin); } catch (x) { /* no opener */ } }
  ready(); var n = 0, t = setInterval(function () { if (got || ++n > 40) { clearInterval(t); if (!got) document.getElementById('m').textContent = 'The report did not arrive. Go back to Calgary Insight and press the button again.'; return; } ready(); }, 500);
})();
</script></body></html>
