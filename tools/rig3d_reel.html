<script src="../engine/core.js"></script><script src="../engine/chars.js"></script><script src="../engine/props.js"></script><script src="../engine/sets.js"></script><script src="../engine/fx.js"></script><script src="../engine/graphics.js"></script>
<script type="module">
/* 2D + 3D COMPOSITING reel: real skinned 3D rigs (acquired glTF, CC0) animated with three.js AnimationMixer,
   rendered to an offscreen WebGL canvas and composited into a 2D set beside a 2D-rigged character. */
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.PAGE_READY = false; stage(1920, 1080);
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setSize(1920, 1080, false); R.outputColorSpace = THREE.SRGBColorSpace; R.setClearColor(0x000000, 0);
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight('#ffffff', '#556644', 1.6)); const sun = new THREE.DirectionalLight('#fff3df', 2.5); sun.position.set(-3, 6, 5); S.add(sun);
const cam = new THREE.OrthographicCamera(-9.6, 9.6, 5.4, -5.4, 0.1, 100); cam.position.set(0, 1.2, 20); cam.lookAt(0, 1.2, 0);
const L = new GLTFLoader(); const [robot, fox] = await Promise.all([L.loadAsync('../acquired/rigged3d/RobotExpressive/RobotExpressive.glb'), L.loadAsync('../acquired/rigged3d/Fox/Fox.glb')]);
robot.scene.scale.setScalar(1.05); robot.scene.position.set(1.6, -3.95, 0); S.add(robot.scene); fox.scene.scale.setScalar(0.024); fox.scene.position.set(-8, -3.5, -2); fox.scene.rotation.y = Math.PI / 2; S.add(fox.scene);
const mR = new THREE.AnimationMixer(robot.scene), mF = new THREE.AnimationMixer(fox.scene); const clip = (g, n) => g.animations.find(a => a.name === n);
let face = null; robot.scene.traverse(o => { if (o.morphTargetDictionary && o.morphTargetDictionary.Surprised !== undefined) face = o; });
const PLAN = [['Wave', 0, 3], ['Dance', 3, 4], ['ThumbsUp', 7, 2], ['Jump', 9, 1.5]];
function robotAt(t) { const [n, t0] = PLAN.filter(p => t >= p[1]).pop(); mR.stopAllAction(); const a = mR.clipAction(clip(robot, n)); a.play(); mR.setTime((t - t0) % clip(robot, n).duration);
  if (face) { const d = face.morphTargetDictionary; face.morphTargetInfluences.fill(0); face.morphTargetInfluences[d.Surprised] = t > 9 ? 1 : 0; face.morphTargetInfluences[d.Angry] = 0; } return n; }
scene('rig3d', 11, t => { const cam2 = CAM.kenBurns(t, 11, [960, 540, 1.0], [960, 520, 1.05]); drawSet('park', t, cam2);
  const n = robotAt(t); mF.stopAllAction(); mF.clipAction(clip(fox, 'Walk') || fox.animations[0]).play(); mF.setTime(t); fox.scene.position.x = -8 + (t * 1.05) % 18;
  R.render(S, cam); C.save(); C.fillStyle = 'rgba(0,0,0,0.22)'; C.beginPath(); C.ellipse(960 + 1.6 * 100, 960, 150, 22, 0, 0, TAU); C.fill(); C.restore(); composite(R.domElement, 0, 0, 1920, 1080, { shadow: ['rgba(0,0,0,0.25)', 12, 6] });
  const p = t < 3 ? MOVES.wave(t, { yaw: 0.5 }) : t < 7 ? MOVES.dance(t) : t < 9 ? MOVES.thumbsUp(t - 7) : MOVES.celebrate(t - 9); drawChar(CAST.rafi, p, 560, 960, 1.4, { t });
  C.fillStyle = 'rgba(6,19,43,0.85)'; C.fillRect(0, 0, 1920, 96); text('2D + 3D COMPOSITING · real 3D rigs in a 2D scene', 40, 50, { font: '800 40px "Fira Sans"', fill: '#f2b705', align: 'left' });
  text(`3D robot clip: ${n} (RobotExpressive, CC0) · 3D fox: Walk (Fox, CC0) · 2D: Rafi rig`, 1880, 50, { font: '500 24px "Fira Sans"', fill: '#c9d3e3', align: 'right' }); });
await Promise.all(['800 40px "Fira Sans"', '500 40px "Fira Sans"'].map(f => document.fonts.load(f))); window.PAGE_READY = true;
</script></body></html>
