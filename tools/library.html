<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../engine/fonts.css"></head><body>
<script src="../engine/core.js"></script><script src="../engine/chars.js"></script><script src="../engine/props.js"></script>
<script src="../engine/sets.js"></script><script src="../engine/fx.js"></script><script src="../engine/graphics.js"></script>
<script>
// Library preview / thumbnail page. Each function draws one full 1920x1080 frame.
window.PAGE_READY = false; stage(1920, 1080);
Promise.all(['700 40px "Fira Sans"', '400 40px "Fira Sans"', '40px Bangers', '800 40px Baloo2'].map(f => document.fonts.load(f))).then(() => window.PAGE_READY = true);
function reset() { C.setTransform(1, 0, 0, 1, 0, 0); C.globalAlpha = 1; C.filter = 'none'; C.clearRect(0, 0, 1920, 1080); }
function showSet(name, t = 2, cast) { reset(); drawSet(name, t, CAM.still(), { noForeground: !!cast }); if (cast) { cast.forEach(([k, x, m], i) => drawChar(CAST[k], MOVES[m || 'idle'](t + i), x, SETS[name].ground, 1.0, { t })); if (SETS[name].foreground) SETS[name].foreground(t); } }
function showProp(name, args = []) { reset(); C.fillStyle = '#f7f3ea'; C.fillRect(0, 0, 1920, 1080); C.fillStyle = '#e7e0d0'; C.fillRect(0, 760, 1920, 320); const s = { towerCrane: 0.85, lrt: 1.1, peaceBridge: 1.1, anchorDesk: 1 }[name] || 2.0; PROPS[name](960, name === 'towerCrane' ? 940 : 820, s, ...args); text(name, 960, 1010, { font: '600 40px "Fira Sans"', fill: '#333' }); }
function propSheet(list, title) { reset(); C.fillStyle = '#f7f3ea'; C.fillRect(0, 0, 1920, 1080); text(title || 'PROPS', 60, 60, { font: '60px Bangers', fill: '#1d3557', align: 'left' }); list.forEach(([n, s, ...args], i) => { const col = i % 6, row = Math.floor(i / 6); const x = 170 + col * 315, y = 400 + row * 330; PROPS[n](x, y, s, ...args); text(n, x, y + 40, { font: '600 26px "Fira Sans"', fill: '#333' }); }); }
function showFX(name, t, opts = {}) { reset(); C.fillStyle = grad(0, 0, 0, 1080, [[0, '#14213d'], [1, '#2b3a55']]); C.fillRect(0, 0, 1920, 1080); C.fillStyle = '#3d4a5c'; C.fillRect(0, 900, 1920, 180); FX[name](t, opts); text(name, 960, 1030, { font: '600 40px "Fira Sans"', fill: '#fff' }); }
function fxSheet(t) { reset(); const list = [['fire', { x: 0, y: 140, w: 120, h: 220 }], ['smoke', { x: 0, y: 120, rise: 250, spread: 80 }], ['explosion', { x: 0, y: 0, t0: t - 0.35, size: 0.6 }], ['rain', {}], ['snow', {}], ['splash', { x: 0, y: 100, t0: t - 0.35, size: 0.7 }], ['lightning', { x: 0, y0: -150, y1: 140, t0: t - 0.05 }], ['sparks', { x: 0, y: 0, t0: t - 0.3 }], ['dust', { x: 0, y: 120, t0: t - 0.4, size: 0.7 }], ['impactStar', { x: 0, y: 0, t0: t - 0.3, size: 0.6 }], ['speedLines', { cx: 0, cy: 0, inner: 60, n: 40 }], ['confetti', { t0: t - 2 }]];
  list.forEach(([n, o], i) => { const col = i % 4, row = Math.floor(i / 4); const x = col * 480, y = row * 360; C.save(); C.beginPath(); C.rect(x + 4, y + 4, 472, 352); C.clip(); C.fillStyle = '#1b263b'; C.fillRect(x, y, 480, 360); C.translate(x + 240, y + 170); if (['rain', 'snow', 'confetti'].includes(n)) { C.translate(-240, -170); C.scale(0.25, 0.334); } FX[n](t, o); C.restore(); text(n, x + 240, y + 330, { font: '600 28px "Fira Sans"', fill: '#fff' }); }); }
let NE = null; fetch('../acquired/geo/naturalearth/ne_50m_admin_1_states_provinces.geojson').then(r => r.json()).then(j => NE = j).catch(() => {});
function gfxSheet(t, th = 'ci') { reset(); const T = THEME[th]; C.fillStyle = T.bg; C.fillRect(0, 0, 1920, 1080);
  C.save(); C.translate(0, 0); C.scale(0.5, 0.5); GFX.bars(t, 0, { th: T, data: [['2021', 41], ['2022', 52], ['2023', 63], ['2024', 71], ['2025', 86]], x: 160, y: 200, w: 1600, h: 640 }); C.restore();
  C.save(); C.translate(960, 0); C.scale(0.5, 0.5); GFX.line(t, 0, { th: T, series: [{ name: 'A', values: [3, 5, 4, 7, 9, 8, 11], area: true }, { name: 'B', values: [2, 3, 5, 4, 6, 7, 6] }], labels: ['J', 'F', 'M', 'A', 'M', 'J', 'J'], x: 200, y: 200, w: 1500, h: 600 }); C.restore();
  C.save(); C.translate(0, 540); C.scale(0.5, 0.5); GFX.donut(t, 0, { th: T, data: [['Roads', 42], ['Transit', 31], ['Parks', 17], ['Other', 10]], center: '$1.2B' }); C.restore();
  C.save(); C.translate(960, 540); C.scale(0.5, 0.5); GFX.timeline(t, 0, { th: T, events: [['1969', 'First Plus 15 bridge'], ['1984', '+15 Policy'], ['2021', 'Policy update'], ['2026', '86 bridges']] }); GFX.lowerThird(t, 0, { th: THEME.news, name: 'Daniel Okafor', title: 'News Channel · Calgary', y: 820 }); C.restore(); }
function broadcastSheet(t) { reset(); drawSet('newsroom', t); GFX.liveBug(t); GFX.clockBug(t, {}); GFX.breakingBanner(t, 0, { headline: 'Sample storm scenario moves across southern Alberta', y: 770 }); GFX.ticker(t, { items: ['DEMO TICKER', 'All graphics reusable', 'Sample data only'] }); }

// ---- catalogue thumbnail helpers ----
function thumbChar(key) { reset(); C.fillStyle = '#f7f3ea'; C.fillRect(0, 0, 1920, 1080); const sp = CAST[key]; [[0, 560], [0.7, 960], [Math.PI / 2, 1360]].forEach(([y, x]) => { const p = MOVES.idle(0.4); p.yaw = y; drawChar(sp, p, x, 1000, 860 / sp.height); }); }
function thumbMove(m) { reset(); C.fillStyle = '#f7f3ea'; C.fillRect(0, 0, 1920, 1080); const sp = CAST.zoya; const tt = { sit: 0.8, stand: 0.1, jump: 0.55, fall: 0.8, punch: 0.25, kick: 0.3, shrug: 0.45, turn: 0.3, celebrate: 0.55 }[m] ?? 0.6; for (let i = 0; i < 4; i++) { const t = tt + (['walk', 'run', 'dance', 'laugh', 'talk', 'clap'].includes(m) ? i * 0.2 : 0); if (i && !['walk', 'run', 'dance', 'laugh', 'talk', 'clap'].includes(m)) break; drawChar(sp, MOVES[m](t), ['walk', 'run', 'dance', 'laugh', 'talk', 'clap'].includes(m) ? 420 + i * 360 : 960, 1000, 800 / sp.height * 0.95, { t }); } }
function thumbTrans(name) { reset(); TRANS[name](0.42, () => drawSet('park', 1), () => drawSet('calgary_night', 1)); }
function thumbCam(name) { reset(); const cams = { still: CAM.still(), pan: CAM.pan(1, 0, 2, [700, 540], [1250, 540]), zoom: CAM.zoom(1, 0, 2, 1, 1.5, [960, 600]), push: CAM.push(1.4, 0, 2, [960, 600], 1.6), pull: CAM.pull(0.6, 0, 2, [960, 600], 1.6), kenBurns: CAM.kenBurns(1.5, 2), track: CAM.track(0, 900, 600, 120, 1.3), dutch: CAM.dutch(CAM.still({ zoom: 1.15 }), 0.1), handheld: CAM.handheld(CAM.still({ zoom: 1.2 }), 1, 14), shake: CAM.shake(CAM.still({ zoom: 1.1 }), 0.45, 0.4, 0.8, 30), whip: CAM.whip(0.6, 0, 1.2, [600, 540], [1350, 540]), orbit2D: CAM.orbit2D(3, 960, 540, 120), crane: CAM.crane(1, 0, 2, 960, 300, 700, 1.25, 1.05) }; drawSet('city_street', 1, cams[name] || CAM.still()); }
function thumbText(name) { reset(); C.fillStyle = '#0b1f3a'; C.fillRect(0, 0, 1920, 1080); const o = { font: '800 120px "Fira Sans"', fill: '#fff' }; const f = { typeOn: () => TXT.typeOn('Typed headline', 0.5, 0, 24, 960, 540, o), fadeUp: () => TXT.fadeUp('Fade up', 0.4, 0, 960, 540, o), pop: () => TXT.pop('POP!', 0.3, 0, 960, 540, { ...o, font: '200px Bangers', fill: '#ffd166', stroke: '#2a1c14', lw: 14 }), slam: () => TXT.slam('SLAM', 0.2, 0, 960, 540, { ...o, fill: '#c8102e' }), perLetter: () => TXT.perLetter('Cascade', 0.3, 0, 960, 540, o), wordByWord: () => TXT.wordByWord('one word at a time', 0.7, 0, 960, 540, o), counter: () => TXT.counter(0.6, 0, 1.6, 0, 86000, 960, 540, { ...o, fill: '#f2b705' }), highlight: () => TXT.highlight('Marker', 0.4, 0, 960, 540, { ...o, fill: '#0b1f3a' }) }; f[name](); }
const GFX_SAMPLES = {
  bars: (t, T) => GFX.bars(t, 0, { th: T, data: [['A', 41], ['B', 52], ['C', 63], ['D', 86]] }), hbars: (t, T) => GFX.hbars(t, 0, { th: T, data: [['North', 41], ['South', 52], ['East', 63], ['West', 86]] }),
  line: (t, T) => GFX.line(t, 0, { th: T, series: [{ name: 'A', values: [3, 5, 4, 7, 9, 8, 11], area: true }, { name: 'B', values: [2, 3, 5, 4, 6, 7, 6] }], labels: ['1', '2', '3', '4', '5', '6', '7'] }), donut: (t, T) => GFX.donut(t, 0, { th: T, data: [['Roads', 42], ['Transit', 31], ['Parks', 17], ['Other', 10]], center: '$1.2B' }),
  counter: (t, T) => GFX.counter(t, 0, { th: T, to: 86, label: 'bridges' }), iconArray: (t, T) => GFX.iconArray(t, 0, { th: T, filled: 18 }), stat: (t, T) => GFX.stat(t, 0, { th: T }),
  map: (t, T) => { if (NE) GFX.map(t, 0, { th: T, features: NE.features.filter(f => f.properties.admin === 'Canada'), bbox: [-141, 41, -52, 70], highlight: { Alberta: T.accent } }); }, pin: (t, T) => { C.fillStyle = '#13355f'; C.fillRect(0, 0, 1920, 1080); GFX.pin(t, 0, 960, 640, { label: 'Calgary', th: T }); },
  route: (t, T) => GFX.route(t, 0, [[300, 800], [700, 500], [1200, 600], [1600, 250]], { col: T.accent }), lowerThird: (t, T) => GFX.lowerThird(t, 0, { th: T, name: 'NAME SURNAME', title: 'Title · Organisation', y: 700 }),
  breakingBanner: (t, T) => GFX.breakingBanner(t, 0, { th: T, headline: 'Headline text goes here', y: 600 }), ticker: (t, T) => GFX.ticker(t, { th: T, items: ['Ticker item one', 'Ticker item two', 'Ticker item three'], y: 900 }), clockBug: (t, T) => { C.save(); C.scale(3, 3); GFX.clockBug(t, { th: T, x: 240, y: 140 }); C.restore(); },
  liveBug: (t, T) => { C.save(); C.scale(4, 4); GFX.liveBug(t, { th: T, x: 165, y: 105 }); C.restore(); }, headline: (t, T) => GFX.headline(t, 0, { th: T, str: 'HEADLINE SLAM', y: 540, size: 140 }), sting: (t, T) => GFX.sting(0.8, 0, { th: T }),
  titleCard: (t, T) => GFX.titleCard(t, 0, { th: T, kicker: 'KICKER', title: 'Title Card', sub: 'subtitle line' }), callout: (t, T) => GFX.callout(t, 0, { th: T, label: 'Callout label' }), timeline: (t, T) => GFX.timeline(t, 0, { th: T, events: [['1969', 'Event one'], ['1984', 'Event two'], ['2021', 'Event three'], ['2026', 'Event four']] }),
  caption: (t, T) => GFX.caption('Burned-in subtitle caption with a speaker chip', { th: T, y: 600, speaker: 'SPEAKER' }), speechBubble: (t, T) => GFX.speechBubble(t, 0, { str: 'Speech bubble!', x: 960, y: 400, tail: [800, 700] }), endCard: (t, T) => GFX.endCard(t, 0, { th: T, title: 'End Card', url: 'example.ca' }), sourceLine: (t, T) => GFX.sourceLine('Source: name of dataset, publisher', { th: T, y: 540 }),
};
function thumbGfx(name, th) { reset(); const T = THEME[th || (['lowerThird', 'breakingBanner', 'ticker', 'clockBug', 'liveBug', 'headline', 'sting', 'pin'].includes(name) ? 'news' : name === 'speechBubble' ? 'cartoon' : 'ci')]; C.fillStyle = T.bg; C.fillRect(0, 0, 1920, 1080); GFX_SAMPLES[name](4, T); }
function thumbFX(name) { const o = { fire: { x: 960, y: 900, w: 300, h: 500, n: 120 }, smoke: { x: 960, y: 900, rise: 600, spread: 200 }, explosion: { x: 960, y: 540, t0: 0.3 }, splash: { x: 960, y: 800, t0: 0.3 }, lightning: { x: 960, t0: 0.95, y1: 900 }, sparks: { x: 960, y: 540, t0: 0.6 }, dust: { x: 960, y: 900, t0: 0.6 }, debris: { x: 960, y: 500, t0: 0.5 }, impactStar: { t0: 0.7 }, confetti: { t0: -1 }, poof: { t0: 0.8 }, shockwave: { t0: 0.8 }, question: { t0: 0 }, exclaim: { t0: 0 }, stars: { x: 960, y: 540, rad: 300 }, zzz: {}, sweatDrops: {}, heartsFloat: { x: 960, y: 700 }, lensFlare: {} }[name] || {};
  reset(); C.fillStyle = grad(0, 0, 0, 1080, [[0, '#14213d'], [1, '#2b3a55']]); C.fillRect(0, 0, 1920, 1080); if (name === 'glow') FX.glow(960, 540, 400); else if (name === 'motionStreaks') FX.motionStreaks(1100, 560, -1, 500, 6); else FX[name](1.0, o); }
function registry() { return { cast: Object.fromEntries(Object.entries(CAST).map(([k, v]) => [k, { name: v.name, role: v.role, channel: v.channel, age: v.age, build: v.build }])), moves: Object.keys(MOVES), expr: Object.keys(EXPR), visemes: VISEMES, sets: Object.fromEntries(Object.entries(SETS).map(([k, v]) => [k, { desc: v.desc, channels: v.channels, layers: v.layers.map(l => l.name + '@' + l.depth) }])), props: PROP_NAMES, fx: FX_NAMES, gfx: Object.keys(GFX), trans: Object.keys(TRANS), cam: Object.keys(CAM), txt: Object.keys(TXT), themes: Object.keys(THEME) }; }
</script></body></html>
