<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../engine/fonts.css"></head><body>
<script src="../engine/core.js"></script><script src="../engine/chars.js"></script><script src="../engine/props.js"></script>
<script src="../engine/sets.js"></script><script src="../engine/fx.js"></script><script src="../engine/graphics.js"></script>
<script>
/* Engine reels: working examples of every reusable preset. Render: python3 render/render.py tools/reels.html full */
window.PAGE_READY = false; stage(1920, 1080);
const lab = (s, x, y, size = 26, col = '#fff') => text(s, x, y, { font: `700 ${size}px "Fira Sans"`, fill: col, shadow: ['rgba(0,0,0,0.7)', 6] });
const banner = (s, sub) => { C.fillStyle = 'rgba(6,19,43,0.85)'; C.fillRect(0, 0, 1920, 96); text(s, 40, 50, { font: '800 44px "Fira Sans"', fill: '#f2b705', align: 'left' }); if (sub) text(sub, 1880, 50, { font: '500 26px "Fira Sans"', fill: '#c9d3e3', align: 'right' }); };
const MOVE_LIST = ['idle', 'walk', 'run', 'jump', 'sit', 'stand', 'turn', 'talk', 'listen', 'laugh', 'cry', 'shout', 'punch', 'kick', 'fall', 'dance', 'celebrate', 'wave', 'point', 'shrug', 'facepalm', 'thumbsUp', 'clap', 'think', 'scared', 'fightStance', 'present', 'holdHead'];
const KEYS = Object.keys(CAST);
scene('moves', 9, t => { C.fillStyle = '#f7f3ea'; C.fillRect(0, 0, 1920, 1080); MOVE_LIST.forEach((m, i) => { const col = i % 7, row = Math.floor(i / 7); const x = 140 + col * 274, y = 300 + row * 228; const k = KEYS[i % KEYS.length]; const sp = CAST[k]; const loopT = ['jump', 'sit', 'stand', 'turn', 'fall', 'point', 'shrug', 'facepalm', 'thumbsUp', 'kick', 'shout'].includes(m) ? t % 2.2 : t; const o = m === 'turn' ? { from: 0, to: Math.PI / 2 * (Math.floor(t / 2.2) % 2 ? -1 : 1), dur: 0.6 } : {}; drawChar(sp, MOVES[m](loopT, o), x, y, 175 / sp.height, { t }); text(m, x, y + 28, { font: '600 22px "Fira Sans"', fill: '#333' }); }); banner('MOTION LIBRARY · 28 presets', 'MOVES.* in engine/chars.js · any character, any preset'); });
scene('camera', 16, t => { const presets = [['CAM.pan', tt => CAM.pan(tt, 0, 2, [700, 540], [1250, 540])], ['CAM.push (zoom in)', tt => CAM.push(tt, 0, 2, [960, 600], 1.6)], ['CAM.pull (zoom out)', tt => CAM.pull(tt, 0, 2, [960, 600], 1.6)], ['CAM.kenBurns', tt => CAM.kenBurns(tt, 2)], ['CAM.handheld', tt => CAM.handheld(CAM.still({ zoom: 1.2 }), tt, 14)], ['CAM.shake (impact)', tt => CAM.shake(CAM.still({ zoom: 1.1 }), tt, 0.4, 0.8, 30)], ['CAM.crane', tt => CAM.crane(tt, 0, 2, 960, 300, 700, 1.25, 1.05)], ['CAM.whip + dutch', tt => CAM.dutch(CAM.whip(tt, 0, 1.2, [600, 540], [1350, 540]), 0.08)]];
  const i = Math.min(7, Math.floor(t / 2)), tt = t - i * 2; const cam = presets[i][1](tt); drawSet('city_street', t, cam); C.save(); camApply(cam, 1); drawChar(CAST.jamal, MOVES.walk(t, { yaw: Math.PI / 2 }), (t * 180) % 2400 - 200, 960, 1.1, { t }); drawChar(CAST.layla, MOVES.wave(t), 1100, 960, 1.1, { t }); C.restore(); banner('CAMERA PRESETS · ' + presets[i][0], 'parallax layers move at depth-scaled speed'); });
const TR = ['dissolve', 'dipBlack', 'wipe', 'push', 'iris', 'irisOut', 'whipPan', 'zoomThrough', 'glitch', 'lightLeak', 'newsSwoosh', 'dipWhite'];
const SA = ['park', 'newsroom', 'mountains', 'office', 'futuristic', 'restaurant', 'calgary_night', 'school', 'forest', 'hospital', 'calgary_skyline', 'shop', 'living_room'];
scene('transitions', TR.length * 1.5, t => { const i = Math.min(TR.length - 1, Math.floor(t / 1.5)), k = (t - i * 1.5); transition(TR[i], k, 0.25, 1.0, () => drawSet(SA[i], t), () => drawSet(SA[i + 1], t)); banner('TRANSITIONS · TRANS.' + TR[i], `${i + 1} / ${TR.length}`); });
scene('text', 10, t => { C.fillStyle = '#0b1f3a'; C.fillRect(0, 0, 1920, 1080); const o = { font: '800 64px "Fira Sans"', fill: '#fff' }; const tt = t % 5;
  TXT.typeOn('TXT.typeOn — typed headline', tt, 0.2, 24, 960, 200, o); TXT.fadeUp('TXT.fadeUp — documentary lower text', tt, 0.6, 960, 320, o); TXT.pop('TXT.pop', tt, 1.0, 560, 450, { ...o, font: '90px Bangers', fill: '#ffd166', stroke: '#2a1c14', lw: 10 }); TXT.slam('TXT.slam', tt, 1.3, 1360, 450, { ...o, fill: '#c8102e' });
  TXT.perLetter('TXT.perLetter cascade', tt, 1.7, 960, 580, o); TXT.wordByWord('TXT.wordByWord reveals one word at a time', tt, 2.2, 960, 700, { ...o, font: '600 48px "Fira Sans"' }); TXT.highlight('TXT.highlight marker', tt, 2.8, 960, 820, { ...o, fill: '#0b1f3a' }); TXT.counter(tt, 3.2, 1.6, 0, 86000, 960, 950, { font: '800 90px "Fira Sans"', fill: '#f2b705' }); banner('ANIMATED TEXT · 8 presets', 'TXT.* in engine/core.js'); });
scene('parallax', 8, t => { const cam = CAM.pan(t, 0, 8, [500, 540], [1420, 540], 'inOut', 1.15); drawSet('mountains', t, cam); C.save(); camApply(cam, 1); drawChar(CAST.marcus, MOVES.walk(t, { yaw: Math.PI / 2, speed: 0.9 }), 400 + t * 170, 1000, 0.9, { t }); C.restore(); banner('PARALLAX · 5 depth layers', 'sky 0.05 · far range 0.2 · near range 0.45 · foothills 0.75 · lake 1.0'); });
const FXL = [['fire', { x: 0, y: 160, w: 130, h: 240 }], ['smoke', { x: 0, y: 140, rise: 260, spread: 80 }], ['explosion', { x: 0, y: 0, size: 0.6 }], ['rain', {}], ['snow', {}], ['splash', { x: 0, y: 100, size: 0.7 }], ['lightning', { x: 0, y0: -170, y1: 150 }], ['sparks', { x: 0, y: 0 }], ['dust', { x: 0, y: 130, size: 0.7 }], ['impactStar', { x: 0, y: 0, size: 0.6 }], ['speedLines', { cx: 0, cy: 0, inner: 60, n: 40 }], ['confetti', {}], ['debris', { x: 0, y: 40 }], ['poof', { x: 0, y: 0 }], ['shockwave', { x: 0, y: 0 }], ['heartsFloat', { x: 0, y: 120 }]];
scene('fx', 8, t => { C.fillStyle = '#0d1b2a'; C.fillRect(0, 0, 1920, 1080); FXL.forEach(([n, o], i) => { const col = i % 4, row = Math.floor(i / 4); const x = col * 480, y = 96 + row * 246; const t0 = Math.floor(t / 2) * 2; C.save(); C.beginPath(); C.rect(x + 3, y + 3, 474, 240); C.clip(); C.fillStyle = '#1b263b'; C.fillRect(x, y, 480, 246); C.translate(x + 240, y + 115); if (['rain', 'snow', 'confetti'].includes(n)) { C.translate(-240, -115); C.scale(0.25, 0.23); } FX[n](t, { ...o, t0: n === 'confetti' ? t0 - 1 : t0 + 0.1 }); C.restore(); text(n, x + 240, y + 225, { font: '600 24px "Fira Sans"', fill: '#fff' }); }); banner('VISUAL EFFECTS · deterministic particles', 'FX.* in engine/fx.js'); });
scene('broadcast', 8, t => { drawSet('newsroom', t, CAM.still(), { noForeground: true }); drawChar(CAST.amara, MOVES.present(t, { seed: 2 }), 960, 1215, 1.9, { t, shadow: false }); SETS.newsroom.foreground(t); GFX.liveBug(t); GFX.clockBug(t, {}); GFX.lowerThird(t, 0.5, { name: 'AMARA SINGH', title: 'Reporter · News Channel', y: 690, out: 3.6 }); GFX.breakingBanner(t, 4.0, { headline: 'Reusable broadcast package: banner, ticker, bugs, lower thirds', y: 760 }); GFX.ticker(t, { items: ['TICKER TEMPLATE', 'edit items[] to change the text', 'speed and colours are parameters'] }); });
Promise.all(['700 40px "Fira Sans"', '500 40px "Fira Sans"', '600 40px "Fira Sans"', '800 40px "Fira Sans"', '40px Bangers', '800 40px Baloo2'].map(f => document.fonts.load(f))).then(() => window.PAGE_READY = true);
</script></body></html>
