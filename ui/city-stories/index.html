<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YYC City Stories · Calgary Insight</title>
<meta name="description" content="YYC City Stories: a free game on the real map of Calgary. Play as a newcomer, a student, a senior or a resident and learn City services, from 311 and transit to recycling and Fair Entry.">
<meta property="og:title" content="YYC City Stories · Calgary Insight">
<meta property="og:description" content="A free game on the real map of Calgary. Learn City services by playing.">
<meta property="og:image" content="https://calgaryinsight.ca/logo-512.png">
<link rel="icon" href="/logo.ico">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .back { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 2; font: 600 12px system-ui, sans-serif; color: #cfe3ff; background: rgba(8, 21, 48, .7); border: 1px solid rgba(255, 255, 255, .2); border-radius: 14px; padding: 5px 10px; text-decoration: none; opacity: .75; }
  .back:hover { opacity: 1; }
</style>
</head>
<body>
<iframe src="https://hassanaliarshad110.github.io/yyc-story/city-stories/" title="YYC City Stories" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; clipboard-write; microphone" allowfullscreen></iframe>
<a class="back" href="/" title="Back to Calgary Insight">◂ Calgary Insight</a>
<script>
  // The game asks this page to go full screen, so the browser shows calgaryinsight.ca (not the game's host) when it does
  addEventListener('message', e => {
    if (e.origin !== 'https://hassanaliarshad110.github.io' || !e.data || e.data.type !== 'yyc-fullscreen') return;
    const d = document.documentElement;
    try { if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (err) {}
  });
</script>
<noscript><p style="color:#fff;font-family:sans-serif;padding:20px">YYC City Stories needs JavaScript. <a style="color:#7dd3fc" href="https://hassanaliarshad110.github.io/yyc-story/city-stories/">Open the game</a>.</p></noscript>
</body>
</html>
