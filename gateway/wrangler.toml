# Calgary Insight AI gateway: deployed by .github/workflows/gateway.yml (the KV id is filled in at deploy time).
name = "calgary-insight-ai"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
FIREBASE_PROJECT = "calgary-insight"
OWNER_EMAILS = "hasssanaliarshad@gmail.com"
ALLOWED_ORIGINS = "https://calgaryinsight.ca,https://www.calgaryinsight.ca"
DEFAULT_LIMIT_USD = "10"

[[kv_namespaces]]
binding = "ACCESS"
id = "KV_ID"
